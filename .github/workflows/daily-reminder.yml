# Once-a-day re-engagement notification.
#
# Deliberately a SEPARATE workflow from push-poll.yml rather than another check
# inside it: the 5-minute poller would fire this reminder up to 288 times a day.
# A once-a-day job is the simplest correct place for anything whose natural
# cadence is "at most once per user per day".
#
# The script it runs (scripts/push/dailyReminder.js) is app-specific and is not
# part of the template — write it to select users by whatever "inactive" means
# here (e.g. users/{uid}.lastActiveDate older than today) and guard against
# double-sends with a lastDailyReminderSent field on the user doc.
name: Daily reminder

on:
  schedule:
    # 15:00 UTC daily — an arbitrary fixed hour; adjust to suit the audience.
    # GitHub cron has no timezone support, so this is UTC regardless of where
    # the users are.
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # Same secret as push-poll.yml — must be added manually in GitHub repo
      # Settings -> Secrets and variables -> Actions, named
      # FIREBASE_SERVICE_ACCOUNT_KEY (full JSON key for a Firebase service
      # account with Firestore + Cloud Messaging access). Not automatable.
      - name: Write Firebase service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' > "${{ runner.temp }}/firebase-service-account.json"

      - name: Run daily reminder
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: node scripts/push/dailyReminder.js
