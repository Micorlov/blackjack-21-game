# Runs scripts/push/poll.js every 5 minutes — this replaces Firestore Cloud
# Functions triggers, which require the paid Blaze plan.
#
# Note on GitHub's scheduler: `*/5` is best-effort. Runs can be delayed by
# several minutes under load, and schedules are disabled automatically after
# ~60 days of repo inactivity. The cursor in scripts/lib/cursor.js makes a late
# run harmless — it just covers a wider window.
name: Push notification poll

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # FIREBASE_SERVICE_ACCOUNT_KEY must be added manually: GitHub repo
      # Settings -> Secrets and variables -> Actions -> New repository
      # secret, named FIREBASE_SERVICE_ACCOUNT_KEY, value = the full JSON
      # key for a Firebase service account with Firestore + Cloud Messaging
      # access (Firebase Console -> Project settings -> Service accounts ->
      # Generate new private key). This step cannot be automated — the key is
      # a credential and must be pasted in by a human.
      - name: Write Firebase service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' > "${{ runner.temp }}/firebase-service-account.json"

      # scripts/lib/firebaseAdmin.js calls initializeApp() with no arguments;
      # it picks the credentials up from this standard env var.
      - name: Run push poll
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: node scripts/push/poll.js
